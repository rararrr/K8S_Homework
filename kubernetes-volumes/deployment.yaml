apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-deployment
  namespace: homework
spec:
  replicas: 3
  selector:
    matchLabels:
      app: homework-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: homework-app
    spec:
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: homework-pvc
        - name: config-volume
          configMap:
            name: homework-config
      initContainers:
        - name: init-container
          image: busybox
          command: ['sh', '-c', 'echo "<h1>Homework Page</h1>" > /usr/share/nginx/html/index.html']
          volumeMounts:
            - name: shared-volume
              mountPath: /usr/share/nginx/html
      containers:
        - name: web-server
          image: nginx:alpine
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: shared-volume
              mountPath: /usr/share/nginx/html
            - name: config-volume
              mountPath: /usr/share/nginx/html/homework/conf
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          lifecycle:
            preStop:
              exec:
                command: ["rm", "-f", "/usr/share/nginx/html/index.html"]
          readinessProbe:
            httpGet:
                path: /index.html
                port: 8000
            #exec:
              #command:
                  #- cat
                  #- /usr/share/nginx/html/index.html
            initialDelaySeconds: 5
            periodSeconds: 10

